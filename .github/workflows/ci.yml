name: CI

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: "Build and Push"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node | ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn
        working-directory: api

      - name: Run tests
        run: yarn test
        working-directory: api

      - name: Generate tag
        id: generate_tag
        run: |
          SHA=${GITHUB_SHA:0:7}
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388839923933:role/ecr-role
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names rocketseat-ci-api --region us-east-2 || aws ecr create-repository --repository-name rocketseat-ci-api --region us-east-2

      - name: Build docker image
        id: build-docker-image
        env:
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          TAG: ${{ steps.generate_tag.outputs.sha }}
        run: |
          docker build -t ${REGISTRY}/rocketseat-ci-api:${TAG} .
          docker push ${REGISTRY}/rocketseat-ci-api:${TAG}
          echo "image=${REGISTRY}/rocketseat-ci-api:${TAG}" >> $GITHUB_OUTPUT
        working-directory: api

      - name: Deploy to App Runner
        uses: awslabs/amazon-app-runner-deploy@main
        with:
          service-name: rocketseat-api
          image: ${{ steps.build-docker-image.outputs.image }}
          access-role-arn: arn:aws:iam::388839923933:role/app-runner-role
          region: us-east-2
          cpu: 1
          memory: 2
          port: 3000

